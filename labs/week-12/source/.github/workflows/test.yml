name: Week 12 Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run API Tests
        run: |
          cd source/api
          npm install
          npm test
      - name: Run Frontend Tests
        run: |
          cd source/frontend
          npm install
          npm test
